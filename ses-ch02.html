<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Flashcards</title>
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--ink:#1b1b1d;--muted:#6b6b70;--line:#e6e3dc;--soft:#efece5;
  --accent:#b8332a;--ok:#2f8f5b;--warn:#c98612;--bad:#c23b2e;
  --r:16px;--sh:0 1px 2px rgba(0,0,0,.04),0 12px 32px -20px rgba(0,0,0,.28);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c1f;--ink:#ececef;--muted:#9a9aa2;--line:#2c2c31;--soft:#25252a;--sh:0 1px 2px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c1f;--ink:#ececef;--muted:#9a9aa2;--line:#2c2c31;--soft:#25252a;--sh:0 1px 2px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:720px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;text-decoration:none;min-width:0}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:0 0 10px}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;height:34px;min-width:34px;padding:0 10px;cursor:pointer;font-size:14px}
main{max-width:720px;margin:0 auto;padding:22px 18px 28px}
h1{font-size:25px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:15px;margin:28px 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:12px 16px;border-radius:12px;cursor:pointer;font-weight:600;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.stack>*+*{margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.kpi{padding:12px 14px}.kpi b{display:block;font-size:24px;letter-spacing:-.02em;line-height:1.1}.kpi span{font-size:13px;color:var(--muted)}
.how{font-size:14.5px;color:var(--muted);padding-left:18px;margin:0}.how li+li{margin-top:4px}
.prog{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.deck{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);text-decoration:none}
.deck:first-child{border-top:0}
.deck:hover{background:var(--soft)}
.deck .t{flex:1;min-width:0}
.deck .t b{display:block;font-weight:600}
.deck .t small{color:var(--muted);font-size:13px}
.deck .prog{width:70px;flex:0 0 70px}
.deck .go{color:var(--muted);font-size:18px}
.deck.grp{background:var(--soft);font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:9px 16px}
.deck.grp:hover{background:var(--soft)}
.deck.sub1{padding-left:30px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:var(--muted);font-size:14px}
.flash{padding:22px 20px;min-height:320px;display:flex;flex-direction:column;gap:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted)}
.chip.piege{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chip.synthese{background:var(--ink);color:var(--bg)}
.q{font-size:23px;line-height:1.35;font-weight:650;letter-spacing:-.01em}
.r{font-size:18px;line-height:1.55;padding-top:16px;border-top:1px dashed var(--line)}
.hint{font-size:14px;color:var(--muted)}
.flash.synth{border:2px solid var(--ink)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade button{padding:14px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:16px}
.grade button small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.grade .g1{color:var(--bad)}.grade .g2{color:var(--warn)}.grade .g3{color:var(--ok)}
.unsure{display:inline-block;background:var(--warn);color:#fff;font-size:11px;font-weight:700;padding:0 6px;border-radius:6px;vertical-align:2px}
.gwrap{overflow-x:auto}
table.gx{width:100%;border-collapse:collapse;font-size:15px;min-width:380px}
table.gx th{font-size:12px;color:var(--muted);padding:6px;border-bottom:1px solid var(--line);text-align:center}
table.gx th:first-child{text-align:left}
table.gx td{padding:9px 6px;border-bottom:1px solid var(--line)}
table.gx td.c{text-align:center;width:90px}
table.gx tr.ok td{background:color-mix(in srgb,var(--ok) 12%,transparent)}
table.gx tr.ko td{background:color-mix(in srgb,var(--bad) 12%,transparent)}
table.gx input{width:20px;height:20px;accent-color:var(--accent)}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.btn.pri kbd{color:#fff;border-color:rgba(255,255,255,.55);background:transparent}
.res{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.muted{color:var(--muted)}.small{font-size:13.5px}
footer{max-width:720px;margin:0 auto;padding:6px 18px 40px;color:var(--muted);font-size:13px}
footer button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
@media (max-width:520px){.q{font-size:21px}.kpi b{font-size:21px}.deck .prog{display:none}h1{font-size:22px}}
@media (hover:none){kbd{display:none}}
</style>
</head>

<header><div class="bar">
  <a class="brand" href="#"><i></i><span id="brand">Flashcards</span></a>
  <span class="sp"></span>
  <button class="ib" id="theme" title="Clair / sombre" aria-label="Changer de thème">◐</button>
</div></header>

<script>
(function(){
'use strict';
const CH={"id":"ses-ch02","matiere":"SES","numero":2,"titre":"Comment est structurée la société française actuelle ?","couleur":"#b8332a","plan":[{"id":"P1","court":"Partie 1","titre":"Partie 1 — Comment caractériser la structure sociale française ?","enfants":[{"id":"intro","court":"Introduction","titre":"Introduction — Quels critères pour dresser le portrait sociologique d'un individu ?"},{"id":"I","court":"I. Facteurs de structuration","titre":"I. Des facteurs multiples de structuration et de hiérarchisation de l'espace social","enfants":[{"id":"IA","court":"A. Les PCS","titre":"A. Les PCS, un outil fondamental afin de faire apparaître des groupes sociaux homogènes et différenciés"},{"id":"IB","court":"B. PCS et diplôme","titre":"B. Des inégalités selon la PCS et le niveau de diplôme"},{"id":"IC","court":"C. Autres facteurs","titre":"C. Des multiples autres facteurs de structuration de l'espace social","enfants":[{"id":"IC1","court":"1. Sexe","titre":"1. Le sexe"},{"id":"IC2","court":"2. Âge","titre":"2. L'âge"},{"id":"IC3","court":"3. Lieu de résidence","titre":"3. Le lieu de résidence"},{"id":"IC4","court":"4. Composition des ménages","titre":"4. La composition des ménages"},{"id":"IC5","court":"5. Chômage, loisirs, culture","titre":"5. Les facteurs se cumulent : inégalités face au chômage, aux loisirs et à la culture"}]}]},{"id":"II","court":"II. Évolutions depuis 1950","titre":"II. Les évolutions de la structure socioprofessionnelle française depuis la seconde moitié du XXe siècle","enfants":[{"id":"II1","court":"1. Salarisation","titre":"1. La salarisation"},{"id":"II2","court":"2. Tertiarisation","titre":"2. La tertiarisation"},{"id":"II3","court":"3. Qualification","titre":"3. L'élévation du niveau de qualification"},{"id":"II4","court":"4. Féminisation","titre":"4. La féminisation des emplois"}]}]},{"id":"P2","court":"Partie 2","titre":"Partie 2 — Comment analyser la structure de la société ?","enfants":[{"id":"P2I","court":"I. Analyses traditionnelles","titre":"I. Les analyses traditionnelles de la structure sociale","enfants":[{"id":"P2IA","court":"A. Marx","titre":"A. La théorie des classes sociales de K. Marx"},{"id":"P2IB","court":"B. Weber","titre":"B. La théorie des classes sociales de Max Weber"}]},{"id":"P2II","court":"II. Notion en débat","titre":"II. Les classes sociales : une notion en débat","enfants":[{"id":"P2IIA","court":"A. Fin des classes ?","titre":"A. La fin des classes sociales ?","enfants":[{"id":"P2IIA1","court":"1. Frontières inter-classe","titre":"1. L'évolution des frontières inter-classe brouille les frontières entre les classes : la moyennisation (Mendras)"}]}]}]},{"id":"PL","court":"Plan à réciter","titre":"Le plan du chapitre à réciter : parties, sous-parties, arguments, exemples"},{"id":"MD","court":"Méthode dissertation","titre":"Méthode de la dissertation (vue en classe pages ㉓-㉔)"}],"cartes":[{"id":"h01","s":"intro","type":"def","t":"Espace social","q":"Définition de l'espace social.","r":"**Représentation de la société** dans laquelle les **individus** sont **positionnés en fonction de leurs caractéristiques**. Le Doc 3 précise : une approche **relationnelle** — les individus se situent **les uns par rapport aux autres** selon plusieurs dimensions (économiques, culturelles, symboliques). Ex : **Hervé** (Renahy)."},{"id":"h02","s":"intro","type":"def","t":"Structure sociale","q":"Définition de la structure sociale.","r":"**Représentation de la société** dans laquelle les **groupes sociaux** sont **différenciés et hiérarchisés**. Ex : les **6 PCS** de l'INSEE, classées selon le revenu et le diplôme."},{"id":"h03","s":"intro","type":"piege","t":"Espace social ≠ structure sociale","q":"Espace social et structure sociale : quelle différence ?","r":"Espace social → des **individus** positionnés selon leurs caractéristiques. Structure sociale → des **groupes sociaux**, **différenciés** *et* **hiérarchisés**. Les deux mots à ne jamais oublier dans la définition : **différenciés, hiérarchisés**."},{"id":"h04","s":"intro","type":"meca","t":"Le portrait d'Hervé","q":"Avec quels critères dresse-t-on le portrait sociologique d'un individu ? Le cas d'Hervé.","r":"**Profession** (ouvrier) · **lieu d'habitation** (son village de naissance, chez ses parents) · **diplôme** (CAP) · **trajectoire professionnelle** (CDD, service militaire, chômage 1 an et demi, CDI) · **sexe** (homme) · **origine sociale** (fils et petit-fils d'ouvrier) · **âge** (jeune) · **situation familiale** (célibataire, sans enfant). ⇒ homme → ouvrier → **classes populaires** : on a **classé** Hervé. Nicolas **Renahy**, *Les gars du coin. Enquête sur une jeunesse rurale*, **2010**."},{"id":"h05","s":"intro","type":"auteur","t":"Durkheim (1893)","q":"Émile Durkheim : la date et les trois « premières fois » que retient le cours ?","r":"**Durkheim, 1893** : premier professeur de sociologie, première enquête sociologique, premier à **formaliser la méthode de la sociologie**. ⚠ 1893 est la date de sa thèse, *De la division du travail social* — sa grande enquête, c'est *Le Suicide* (1897)."},{"id":"h06","s":"intro","type":"auteur","t":"Bourdieu, puis Lahire","q":"Pierre Bourdieu : quand, et sur quoi a-t-il travaillé selon le cours ? Qui vient après lui ?","r":"**Bourdieu**, ≈ **années 60** : l'école, l'argent, la mode, la politique, la **domination masculine**, la pauvreté, le cinéma, le musée… et la **structure sociale**. Après lui, dans les **années 80** : Bernard **Lahire**. On retrouve Bourdieu au I.B avec l'**habitus** ouvrier."},{"id":"syn-intro","s":"intro","type":"synthese","t":"Synthèse — le portrait d'Hervé","q":"À l'oral, toute l'introduction : du portrait d'Hervé à la définition de la structure sociale. Avec les auteurs.","r":"① Le texte : **Hervé** (Nicolas **Renahy**, *Les gars du coin*, **2010**) ② Les critères pour le situer : **profession** (ouvrier), **lieu d'habitation**, **diplôme** (CAP), **trajectoire professionnelle** (CDD → chômage → CDI), **sexe**, **origine sociale** (fils et petit-fils d'ouvrier), **âge**, **situation familiale** ③ On le **classe** : homme → ouvrier → **classes populaires** ④ **Espace social** : les **individus** positionnés en fonction de leurs caractéristiques ⑤ **Structure sociale** : les **groupes sociaux différenciés et hiérarchisés** ⑥ Les sociologues : **Durkheim** (1893, méthode de la sociologie) → **Bourdieu** (années 60, jusqu'à la structure sociale) → **Lahire** (années 80)."},{"id":"q01","s":"IA","type":"def","t":"PCS : sigle et dates","q":"Que signifie PCS ? Qui l'a créée, et quand ?","r":"**Professions et catégories socioprofessionnelles** : la nomenclature de l'**INSEE**. **CSP en 1954**, remaniée en **PCS en 1982** : on supprime les catégories devenues obsolètes et on en crée de nouvelles, parallèlement aux évolutions de la structure sociale (Doc 1, **Vernet-Habasque 2015**)."},{"id":"q02","s":"IA","type":"chiffre","t":"Les 6 PCS d'actifs","q":"Les 6 groupes de PCS d'actifs, dans l'ordre, avec leurs sigles.","r":"1. **Agriculteurs exploitants** (AE) · 2. **Artisans, commerçants, chefs d'entreprise** (ACCE) · 3. **Cadres et professions intellectuelles supérieures** (CPIS) · 4. **Professions intermédiaires** (PI) · 5. **Employés** · 6. **Ouvriers**. Le Doc 1 ajoute 7. Retraités et 8. Autres personnes sans activité professionnelle."},{"id":"q03","s":"IA","type":"meca","t":"Les critères de classement","q":"Les critères de l'INSEE pour classer quelqu'un dans une PCS ?","r":"Le **statut** (indépendant / salarié) · le **secteur d'activité** · la **taille** de l'entreprise · **public / privé** · le **niveau de qualification** · la **position hiérarchique**. Ex du cours : **prof de lycée = 341a**, **inspecteur / chef d'établissement = 341b** : même secteur, la hiérarchie les sépare."},{"id":"q04","s":"IA","type":"piege","t":"Le salaire, critère des PCS ?","q":"Le salaire est-il un critère de classement dans les PCS ?","r":"**Non** : « salaire n'est pas un critère ». On classe la **profession** (statut, qualification, hiérarchie…), pas le revenu. Le revenu est **corrélé** aux PCS (le schéma revenu / diplôme), mais il ne sert pas à les construire."},{"id":"q05","s":"IA","type":"meca","t":"L'intérêt de la nomenclature","q":"Quel est l'intérêt de la nomenclature des PCS ?","r":"**Créer des groupes d'individus qui partagent des caractéristiques communes** ⇒ ils présentent une forme d'**homogénéité sociale** : **mêmes comportements** — **consommation, mode, vote**… L'INSEE (Doc 1) : ils sont présumés entretenir des relations entre eux, avoir des comportements et des opinions analogues, se considérer et être considérés comme appartenant à une même catégorie."},{"id":"q06","s":"IA","type":"meca","t":"Indépendant ou salarié ?","q":"Premier critère des PCS, le statut. Pour chaque catégorie de la nomenclature, coche le bon statut.","r":"Le critère : **indépendant** = il travaille à son compte, sans employeur ; **salarié** = il travaille pour un employeur contre un salaire. Les groupes **1 et 2** sont indépendants, les groupes **3 à 6** salariés (colonnes remplies en classe)… **sauf les professions libérales** (médecin, avocat…), rangées chez les cadres (3) mais **indépendantes**. C'est pour ça que le statut ne suffit pas : il faut aussi la qualification et la hiérarchie.","grille":{"colonnes":["Indépendant","Salarié"],"lignes":[["11 · Agriculteurs sur petite exploitation",0],["21 · Artisans",0],["23 · Chefs d'entreprise de 10 salariés ou plus",0],["31 · Professions libérales",0],["33 · Cadres de la fonction publique",1],["47 · Techniciens",1],["55 · Employés de commerce",1],["62 · Ouvriers qualifiés de type industriel",1]]}},{"id":"q07","s":"IA","type":"meca","t":"Le schéma revenu / diplôme","q":"Sur le schéma revenu moyen / diplôme moyen, où se placent les PCS ?","r":"**CPIS** : revenu ⊕ et diplôme ⊕ (en haut à droite) · **PI** : diplôme ⊕, revenu moyen · **ACCE** : revenu ⊕, diplôme ⊖ · **Ouvriers** et **employés** : revenu ⊖ et diplôme ⊖ (en bas à gauche). Les trois critères qui hiérarchisent : **CSP, diplôme, revenu**. ⚠ Le cahier place les **agriculteurs** tout en haut à gauche : à vérifier avec le prof, leurs revenus sont en moyenne plutôt faibles et très dispersés."},{"id":"syn-IA","s":"IA","type":"synthese","t":"Synthèse — les PCS","q":"À l'oral, tout le I.A : pourquoi les PCS sont un outil fondamental pour faire apparaître des groupes sociaux homogènes et différenciés. Avec les dates, les critères et un exemple.","r":"① **L'outil** : la nomenclature de l'**INSEE**, **CSP 1954** → **PCS 1982** (Doc 1, Vernet-Habasque) ② **6 groupes d'actifs** : AE, ACCE, CPIS, PI, employés, ouvriers ③ **Les critères** : statut (indépendant / salarié), secteur, taille, public / privé, qualification, hiérarchie — **pas le salaire** ; ex : prof de lycée **341a** / chef d'établissement **341b** ④ **Homogènes** : les membres d'une PCS partagent des caractéristiques ⇒ **homogénéité sociale**, mêmes comportements (conso, mode, vote) ⑤ **Différenciés et hiérarchisés** : placées selon **revenu** et **diplôme**, les PCS forment une hiérarchie (CPIS en haut, ouvriers et employés en bas) ⑥ ⇒ les PCS donnent à voir la **structure sociale**."},{"id":"dp01","s":"IB","type":"chiffre","t":"Niveau de vie CPIS / employés","q":"Un chiffre pour montrer l'écart de niveau de vie entre CPIS et employés.","r":"**INSEE, 2023** : le niveau de vie annuel moyen des **employés** est de **24 450 €** ; celui des **CPIS** est plus élevé d'environ **18 000 € par an** [?]."},{"id":"dp02","s":"IB","type":"meca","t":"De la CSP au salaire","q":"La chaîne qui relie une CSP élevée à un salaire élevé.","r":"CSP élevée → **niveau de diplôme** élevé → **niveau de qualification** élevé → ↗ **capital humain** → ↗ **productivité** → ↗ **salaire**. Le capital humain, c'est **Romer** et le chapitre 1 (I.B.4)."},{"id":"dp03","s":"IB","type":"chiffre","t":"Doc 2 : les non-diplômés","q":"Doc 2 (Céreq, Génération 2013) : les trois chiffres des jeunes sans diplôme, et ceux des écoles de commerce et d'ingénieurs.","r":"Sans diplôme : **49 %** au chômage · **34 %** en CDI parmi ceux qui ont un emploi · salaire médian **1 200 €**. Écoles de commerce et d'ingénieurs : **7 %** au chômage · **90 %** en CDI · **2 370 €**."},{"id":"dp04","s":"IB","type":"meca","t":"Diplôme et chômage","q":"Quel lien entre niveau de diplôme et taux de chômage ? Avec l'exemple du cours.","r":"**Corrélation négative** : plus le niveau de diplôme est faible, plus le taux de chômage est élevé. Ex : **10 %** des jeunes diplômés du **supérieur long** sont au chômage, contre **28 %** des détenteurs d'un **CAP / BEP** (Doc 2, **Céreq**)."},{"id":"dp05","s":"IB","type":"meca","t":"Diplôme, CDI et salaire","q":"Quel lien entre niveau de diplôme, CDI et salaire médian ?","r":"**Corrélations positives** : plus le diplôme ↗, plus les jeunes ont de chances d'être en **CDI** (**34 %** des non-diplômés en emploi, contre **90 %** des sortants d'écoles de commerce et d'ingénieurs) et d'avoir un **salaire** élevé (salaire médian **1 200 €** sans diplôme, **2 370 €** en école). Doc 2, **Céreq**."},{"id":"dp06","s":"IB","type":"meca","t":"Pourquoi le diplôme protège","q":"Pourquoi le diplôme protège-t-il sur le marché du travail ?","r":"Le diplôme **protège du chômage** et permet d'**accéder à un emploi stable au salaire élevé**. Diplôme ↗ → **qualification** ↗ ; or pour le travail qualifié, **Qo \u003c Qd** (moins de travailleurs qualifiés que d'emplois qui les demandent) → plus de **pouvoir de négociation** → de meilleurs emplois. Et ça fonctionne aussi dans l'autre sens (Doc 2, **Céreq**)."},{"id":"dp07","s":"IB","type":"chiffre","t":"Revenu et espérance de vie","q":"Revenu et espérance de vie : le lien et les chiffres du cours.","r":"**Corrélation positive** : plus le revenu est élevé, plus l'espérance de vie est élevée. La vidéo : les **5 %** d'hommes les plus aisés (**5 800 €/mois**) vivent **13 ans** de plus que les plus modestes ; **8 ans** pour les femmes. Homme **CPIS : 84 ans**, homme **ouvrier : 77 ans**. Les femmes vivent 3 ans de plus."},{"id":"dp08","s":"IB","type":"meca","t":"Pourquoi les cadres vivent plus longtemps","q":"Pourquoi les CPIS vivent-ils plus longtemps que les ouvriers ? Les raisons du cours et la notion sociologique.","r":"① **Pratiques à risques** : les cadres **fument moins** que les ouvriers (addictions) ② **Accès aux soins** : les CSP⊕ se soignent mieux ③ **Risques du travail**. Et l'**habitus ouvrier** (**Bourdieu**) : un **corps résistant**, valorisé → on va **moins chez le médecin**."},{"id":"syn-IB","s":"IB","type":"synthese","t":"Synthèse — PCS et diplôme","q":"À l'oral, tout le I.B : montrer que la PCS et le diplôme hiérarchisent l'espace social. Avec les chiffres et les sources.","r":"① **Des écarts de niveau de vie** selon la PCS : employés **24 450 €/an** (INSEE 2023), CPIS nettement au-dessus ② **La chaîne** : CSP élevée → diplôme → qualification → **capital humain** → **productivité** → **salaire** ③ **Le diplôme protège du chômage** (corrélation négative) : **10 %** de chômage pour le supérieur long contre **28 %** pour un CAP/BEP, **49 %** sans diplôme (**Céreq**) ④ **Il donne l'emploi stable et le salaire** (corrélations positives) : **34 %** de CDI sans diplôme contre **90 %** en école ; **1 200 €** contre **2 370 €** ⑤ Pourquoi : **Qo \u003c Qd** pour le travail qualifié → pouvoir de négociation ⑥ **Jusqu'à la santé** : homme **CPIS 84 ans**, **ouvrier 77 ans** — pratiques à risques, accès aux soins, risques du travail, **habitus** ouvrier (**Bourdieu**) ⑦ ⇒ PCS et diplôme sont des **facteurs de hiérarchisation** de l'espace social."},{"id":"sx01","s":"IC1","type":"chiffre","t":"L'écart de salaire femmes-hommes","q":"L'écart de revenu entre femmes et hommes : le chiffre, et ses trois causes.","r":"Les femmes gagnent **24 % de moins** que les hommes (Doc 3 : écart de **revenu salarial** de **24 %**). Causes : ① les **tâches domestiques** ② plus souvent à **temps partiel** ③ plus **diplômées**, mais dans de **moins bons emplois**. Ce qui reste inexpliqué, c'est la **discrimination pure** (voir la carte piège)."},{"id":"sx02","s":"IC1","type":"piege","t":"Écart de salaire = discrimination ?","q":"Les 24 % d'écart de salaire entre femmes et hommes, est-ce de la discrimination ?","r":"**Pas en totalité.** La plus grande partie s'explique par le **temps de travail** (temps partiel), les **postes** et les **secteurs**. La part **inexpliquée à conditions équivalentes** — la discrimination « pure » — est bien plus faible : **9,9 %** dans le Doc 3. ⚠ Le cahier note **12,8 %** puis **8 %** : en copie, cite le chiffre **avec sa source**."},{"id":"sx03","s":"IC1","type":"meca","t":"Des choix socialement construits","q":"Pourquoi les femmes occupent-elles des emplois moins rémunérés ? Le mécanisme de la socialisation genrée.","r":"Des emplois moins rémunérés… par **choix** (« goûts »), mais des choix **socialement construits** : la **socialisation genrée** fait **intérioriser des normes et des valeurs** (= des **dispositions genrées**). D'où l'orientation vers des **filières moins rémunérées** et **moins d'ambition** (elles se sous-estiment)."},{"id":"sx04","s":"IC1","type":"meca","t":"L'école et l'autocensure","q":"Comment l'école entretient-elle les inégalités entre filles et garçons ? Les deux exemples du cours.","r":"① Quand on doit **estimer ses notes**, les **filles se sous-estiment**, les **garçons se surestiment** → elles **libèrent des places** qu'elles pourraient occuper et **laissent la place aux garçons** ② Le **prof de maths** interroge les filles avec des **questions de vérification**, les garçons avec des **questions qui vont plus loin**."},{"id":"sx05","s":"IC1","type":"auteur","t":"Baudelot & Establet","q":"Baudelot & Establet, *Allez les filles !* : que montrent-ils, et quel paradoxe en tirer ?","r":"**Baudelot & Establet**, *Allez les filles !* (**1992**) : les **notes**, la **réussite au bac** et les **diplômes** sont **en faveur des filles**. Le paradoxe : plus **diplômées**, elles ont pourtant de **moins bons emplois** et des salaires plus bas — la réussite scolaire ne se convertit pas en réussite professionnelle."},{"id":"sx06","s":"IC1","type":"meca","t":"Le temps de travail","q":"Comment la répartition du travail domestique pèse-t-elle sur la carrière des femmes ?","r":"**Répartition inégalitaire du travail domestique et parental** → **moins d'heures sup**, **plus de temps partiel** → **moins de promotions** et moins de chances d'augmentation. Doc 3 : les femmes font **72 %** des tâches ménagères (**183 min** par jour contre **105** pour les hommes)."},{"id":"sx07","s":"IC1","type":"meca","t":"Les enfants et la carrière","q":"Avoir des enfants : quel effet sur la carrière, selon qu'on est un homme ou une femme ?","r":"Pour un **homme**, avoir des enfants **valorise la carrière** ; pour une **femme**, ça la **dévalorise**. Doc 3 : **72 %** des mères de famille ont un emploi contre **85 %** des pères ; **84 %** des familles monoparentales ont une femme à leur tête."},{"id":"sx08","s":"IC1","type":"meca","t":"Le plafond de verre","q":"Qu'est-ce que le « plafond de verre » ? Avec les chiffres du cours, dans l'entreprise et en politique.","r":"Les femmes accèdent moins aux **postes prestigieux** et de **pouvoir**. Entreprise : **41,6 %** des cadres sont des femmes, mais **90 %** des hauts dirigeants sont des hommes. Politique : **sous-représentées** ; malgré la **loi sur la parité**, moins de **20 %** des maires et moins de **40 %** des députés sont des femmes."},{"id":"sx09","s":"IC1","type":"chiffre","t":"Les violences faites aux femmes","q":"Sphère familiale et risque : les chiffres des violences faites aux femmes.","r":"**1 femme tous les 3 jours** meurt sous les coups de son conjoint ou ex-conjoint · **1 femme sur 3** a subi une agression sexuelle (cahier) · Doc 3 : **84 000** femmes victimes de viol ou de tentative de viol chaque année, moins de **10 %** portent plainte."},{"id":"sx10","s":"IC1","type":"meca","t":"La sphère médiatique, test de Bechdel","q":"Le test de Bechdel : ses trois critères, et ce qu'il révèle de la sphère médiatique.","r":"Un film passe le test s'il y a ① **2 femmes nommées** ② qui **parlent ensemble** ③ d'**autre chose que d'un homme**. Le cahier note « − 20 % des films » [?] → une **représentation sexiste de la société**. Plus largement : **sous-représentation** des femmes (livres, radio, TV, films), **moins de temps de parole** et d'antenne, le **sport** (Doc 3 : **15 %** du sport à la télé est féminin)."},{"id":"syn-IC1","s":"IC1","type":"synthese","t":"Synthèse — le sexe","q":"À l'oral, tout le I.C.1 : montrer que le sexe est un facteur de structuration et de hiérarchisation de l'espace social. Dans l'emploi, la famille, le risque, les médias, la politique. Avec les auteurs et les chiffres.","r":"① **Emploi — le salaire** : **24 %** d'écart de revenu salarial (Doc 3), dont une part seulement de **discrimination pure** (**9,9 %** à conditions équivalentes) ② **Pourquoi** : des emplois moins payés « choisis », mais des choix **socialement construits** par la **socialisation genrée** (normes et valeurs intériorisées) → filières moins rémunérées, moins d'ambition ; l'**école** : les filles se **sous-estiment**, le prof de maths pose aux garçons des questions qui vont plus loin ③ **Le paradoxe** : **Baudelot & Establet**, *Allez les filles !* — elles réussissent mieux (notes, bac, diplômes) mais ont de moins bons emplois ④ **Le temps de travail** : travail domestique et parental inégal (**72 %** des tâches) → temps partiel, moins d'heures sup, moins de promotions ; les **enfants** valorisent la carrière des hommes, dévalorisent celle des femmes ⑤ **Plafond de verre** : **41,6 %** des cadres, mais **90 %** des hauts dirigeants sont des hommes ; parité : moins de **20 %** des maires ⑥ **Famille et risque** : **1 femme tous les 3 jours** tuée par son conjoint, **1 sur 3** agressée sexuellement ⑦ **Médias** : sous-représentation, **test de Bechdel** → une représentation sexiste de la société ⑧ ⇒ le **sexe** différencie et hiérarchise l'espace social."},{"id":"ag01","s":"IC2","type":"def","t":"Âge ≠ cycle de vie","q":"Distingue l'âge et le cycle de vie, avec un exemple.","r":"L'**âge** = une donnée **biologique** : les années écoulées depuis la naissance. Le **cycle de vie** = une notion **sociale** : la succession des grandes étapes de l'existence (**formation, vie active, retraite**), marquées par des événements (fin des études, premier emploi, mise en couple, enfants, retraite). Ex : à **25 ans**, un étudiant en master est encore dans la jeunesse ; **Hervé**, CAP à 18 ans, est déjà dans la vie active."},{"id":"ag02","s":"IC2","type":"def","t":"Patrimoine","q":"Définition du patrimoine. Brut ou net ?","r":"L'ensemble des **biens possédés** par un ménage **à un moment donné** : logement (immobilier), placements (livrets, actions, assurance-vie), biens professionnels. C'est un **stock**. **Brut** = sans retirer les dettes ; **net** = dettes déduites. Ex : Doc 4 (INSEE 2018), patrimoine **brut** moyen **276 000 €**."},{"id":"ag03","s":"IC2","type":"def","t":"Épargne","q":"Définition de l'épargne, et son lien avec le patrimoine.","r":"La part du **revenu disponible** qui **n'est pas consommée** : **épargne = revenu disponible − consommation**. C'est un **flux**, qui vient **alimenter le stock** de patrimoine — comme l'investissement alimente le stock de capital (chapitre 1)."},{"id":"ag04","s":"IC2","type":"piege","t":"Flux ou stock ?","q":"Flux (mesuré sur une période) ou stock (mesuré à une date) ? Coche la bonne colonne.","r":"Le critère : un **flux** se mesure **sur une période** (par an, par mois) ; un **stock** se mesure **à une date**. Les flux **alimentent** les stocks : l'**épargne** alimente le **patrimoine**, l'**investissement** alimente le **capital**. Les **revenus du patrimoine** (dividendes, loyers) sont des flux tirés d'un stock.","grille":{"colonnes":["Flux","Stock"],"lignes":[["Le revenu disponible d'un ménage en 2024",0],["L'épargne d'une année",0],["Le patrimoine d'un ménage au 31 décembre",1],["La consommation du mois",0],["Le logement que possède le ménage",1],["Les dividendes reçus dans l'année",0],["Le solde du livret A au 1er janvier",1],["L'investissement d'une entreprise en 2024 (chapitre 1)",0]]}},{"id":"ag05","s":"IC2","type":"chiffre","t":"Doc 4 : le patrimoine selon l'âge","q":"Doc 4 (INSEE, 2018) : les chiffres clés du patrimoine selon l'âge, avec deux calculs.","r":"Moins de 30 ans **69 900 €** · 50-59 ans **337 500 €** (le maximum) · 70 ans et plus **308 000 €** · ensemble **276 000 €** (moyenne, brut). Calculs : les 50-59 ans ont **près de 5 fois plus** que les moins de 30 ans (337 500 / 69 900 ≈ **4,8**) ; les moins de 30 ans ont **4 fois moins** que la moyenne ; après 60 ans, environ **− 9 %**."},{"id":"ag06","s":"IC2","type":"meca","t":"Revenu ↔ patrimoine","q":"Quels liens entre le revenu et le patrimoine ? Les deux sens, et la conséquence.","r":"① **Revenu → patrimoine** : l'**épargne** s'accumule en patrimoine (logement, placements) ; plus le revenu est élevé, plus on épargne. ② **Patrimoine → revenu** : le patrimoine rapporte des **revenus du patrimoine** (loyers, intérêts, dividendes), qui permettent d'épargner encore plus. ⇒ Un **processus cumulatif** : les inégalités de **patrimoine** sont bien **plus fortes** que les inégalités de revenus."},{"id":"ag07","s":"IC2","type":"auteur","t":"Modigliani : le cycle de vie","q":"Le modèle du cycle de vie de Modigliani (Doc 5) : les trois phases du graphique.","r":"**Franco Modigliani** (années 1950). **A — jeunesse** : consommation > revenu → on **s'endette**, patrimoine **négatif**. **B — activité** : revenu > consommation → on **épargne**, le patrimoine monte jusqu'à son **maximum à la fin de la vie active**. **C — retraite** : revenu \u003c consommation → on **désépargne**, le patrimoine **diminue**."},{"id":"ag08","s":"IC2","type":"meca","t":"Pourquoi le maximum à 50-59 ans","q":"Pourquoi le patrimoine culmine-t-il vers 50-59 ans, puis baisse-t-il un peu ? (Doc 4)","r":"**Jeunesse** : revenus faibles en début de carrière, pas encore eu le temps d'épargner, souvent **endetté** (prêt étudiant, premier crédit). **Vie active** : les revenus montent avec l'**ancienneté**, on épargne, on **rembourse le crédit du logement**, on reçoit souvent un **héritage vers 50 ans**. **Retraite** : les revenus baissent → **désépargne** et **transmission** aux enfants (donations). C'est le cycle de vie de **Modigliani**."},{"id":"ag09","s":"IC2","type":"meca","t":"La pyramide des âges de l'homme","q":"*Les âges de l'homme* (fin XIXe, Doc 5) : pourquoi la vie est-elle représentée en pyramide ?","r":"La vie vue comme une **ascension puis un déclin** : on monte marche après marche jusqu'au **sommet à 50 ans** — maturité, réussite professionnelle et sociale, revenu, patrimoine et prestige au plus haut (l'homme en redingote, chapeau à la main) — puis on **redescend** : la vieillesse = perte de force, d'autonomie et de **statut**. Chaque âge = une **position sociale**, et ces positions sont **hiérarchisées**."},{"id":"ag10","s":"IC2","type":"meca","t":"Pourquoi plus de pyramide aujourd'hui","q":"Représenterait-on encore le cycle de vie en pyramide aujourd'hui ? Les trois raisons.","r":"**Non.** ① **Vieillesse plus longue et active** : espérance de vie **80 ans** (hommes), **plus de 85** (femmes) ; retraités actifs (loisirs, grands-parents), dépendance plus tardive ; le patrimoine des **70 ans et plus** (308 000 €) reste **au-dessus de la moyenne** (Doc 4). ② **Jeunesse qui s'allonge** : études plus longues, emploi stable plus tard (CDD, chômage puis CDI, comme **Hervé**), couple et enfants plus tard. ③ **Parcours moins linéaires** (chômage, reconversions, divorces, familles recomposées) — et la gravure ne montre qu'un **homme** : le parcours des femmes diffère (I.C.1)."},{"id":"syn-IC2","s":"IC2","type":"synthese","t":"Synthèse — l'âge","q":"À l'oral, tout le I.C.2 : montrer que l'âge est un facteur de structuration de l'espace social. Avec les définitions, les chiffres du Doc 4 et l'auteur.","r":"① **Âge ≠ cycle de vie** : donnée biologique / succession sociale d'étapes (formation, activité, retraite) ② **Patrimoine** (stock) alimenté par l'**épargne** (flux) ; revenu et patrimoine se renforcent → **processus cumulatif** ③ **Doc 4 (INSEE 2018)** : **69 900 €** avant 30 ans, **337 500 €** à 50-59 ans (**× 4,8**), **308 000 €** après 70 ans ④ **Pourquoi** : le cycle de vie de **Modigliani** — jeunesse endettée, activité qui épargne (crédit remboursé, **héritage** vers 50 ans), retraite qui désépargne et transmet ⑤ **Hier** : la vie en **pyramide** (*Les âges de l'homme*, sommet à 50 ans) ; **aujourd'hui** : vieillesse longue et active, jeunesse allongée, parcours moins linéaires ⑥ ⇒ à revenu proche, un jeune et un quinquagénaire n'occupent pas la **même position** : l'âge **structure et hiérarchise** l'espace social."},{"id":"lr01","s":"IC3","type":"auteur","t":"Oberti : ce qui sépare les quartiers","q":"Marco Oberti (2016, Doc 6) : qu'est-ce qui différencie les quartiers favorisés et défavorisés ? Avec un exemple.","r":"**Marco Oberti**, *Que faire contre les inégalités*, **2016**. ① **Le profil des habitants** : leurs ressources **économiques** (revenus), **culturelles** (diplômes), **sociales** (relations). ② **Les équipements et services**, publics et privés : **écoles, transports**, équipements culturels et sportifs, **sécurité, espaces verts, commerces**. Ex : les quartiers aisés de l'**ouest parisien** (lycées réputés, parcs, métro) face à certains **quartiers prioritaires** de banlieue."},{"id":"lr02","s":"IC3","type":"def","t":"Ségrégation résidentielle","q":"Les groupes sociaux se répartissent-ils au hasard dans l'espace ? Quel nom porte ce phénomène ?","r":"**Non** : la **ségrégation résidentielle** — les groupes sociaux, inégalement dotés en ressources, se répartissent **de façon inégale entre les quartiers**, d'où une **hiérarchie des quartiers** (profil socio-économique, voire ethnique, et qualité des équipements). C'est le **prix du logement** qui trie : seuls les plus aisés paient les quartiers les mieux dotés ; les modestes se concentrent là où les loyers sont bas ou dans le **logement social** (Oberti, Doc 6)."},{"id":"lr03","s":"IC3","type":"meca","t":"L'entre-soi, un processus cumulatif","q":"Quels effets produit la concentration des groupes favorisés dans un quartier ? La chaîne.","r":"① Les favorisés **concentrent leurs ressources** dans le quartier (argent, relations, associations, écoles) → il s'**équipe encore mieux** ② Mieux doté → plus **attractif** → il attire d'autres favorisés, les **prix du logement montent** → les modestes sont écartés ③ Leur présence **maintient et accentue l'entre-soi** → les **inégalités urbaines se creusent**. Le lieu de résidence **reflète** les inégalités et les **renforce** (Oberti, Doc 6)."},{"id":"lr04","s":"IC3","type":"auteur","t":"Bourdieu : les trois capitaux","q":"Les trois ressources du texte d'Oberti renvoient à quel concept de Bourdieu ?","r":"Aux **trois capitaux** de **Bourdieu** : **économique** (revenus, patrimoine), **culturel** (diplômes, savoirs), **social** (réseau de relations). Les groupes favorisés les cumulent et les concentrent dans les mêmes quartiers. À garder pour la Partie 2 (classes sociales)."},{"id":"syn-IC3","s":"IC3","type":"synthese","t":"Synthèse — le lieu de résidence","q":"À l'oral, tout le I.C.3 : montrer que le lieu de résidence structure et hiérarchise l'espace social. Avec l'auteur et un exemple.","r":"① **Oberti (2016)** : les quartiers diffèrent par le **profil des habitants** (ressources économiques, culturelles, sociales — les **capitaux de Bourdieu**) et par leurs **équipements** (écoles, transports, sécurité, espaces verts, commerces) ② Pas de hasard : **ségrégation résidentielle**, le **prix du logement** trie les ménages ; ex : **ouest parisien** / **quartiers prioritaires** ③ **Processus cumulatif** : ressources concentrées → quartier mieux doté → plus attractif → prix ↑ → modestes écartés → **entre-soi** ④ ⇒ le lieu de résidence **reflète** les inégalités de revenu et de diplôme, et les **renforce** : c'est un facteur de **hiérarchisation**."},{"id":"mn01","s":"IC4","type":"def","t":"Ménage (INSEE)","q":"Définition d'un ménage au sens de l'INSEE.","r":"L'ensemble des **occupants d'un même logement**, **sans qu'ils soient forcément unis par des liens de parenté** (cohabitation, par exemple). Un ménage peut être composé d'**une seule personne**. (Doc 7, notion.)"},{"id":"mn02","s":"IC4","type":"def","t":"Revenu médian","q":"Qu'est-ce que le revenu médian ? En quoi diffère-t-il de la moyenne ?","r":"Le revenu qui **partage la population en deux moitiés égales** : **50 %** gagnent moins, **50 %** gagnent plus. Contrairement à la **moyenne**, il n'est **pas tiré vers le haut** par les très hauts revenus. Ex : Doc 7, personne seule **1 563 €** par mois en 2016."},{"id":"mn03","s":"IC4","type":"def","t":"Revenu disponible","q":"Comment calcule-t-on le revenu disponible ?","r":"**Revenus d'activité et du patrimoine** (revenus primaires) **+ prestations sociales − impôts directs et cotisations sociales**. C'est ce qui reste au ménage pour **consommer et épargner**. Les revenus médians du Doc 7 sont des revenus disponibles."},{"id":"mn04","s":"IC4","type":"def","t":"Seuils de pauvreté et de richesse","q":"Comment fixe-t-on le seuil de pauvreté et le seuil de richesse ? Les chiffres pour une personne seule.","r":"**Seuil de pauvreté** = la **moitié** du revenu médian ; **seuil de richesse** = le **double** (Doc 7, **Observatoire des inégalités**). Personne seule en 2016 : **781 €** / médiane **1 563 €** / **3 125 €**. ⚠ L'**INSEE**, lui, fixe le seuil de pauvreté officiel à **60 %** du niveau de vie médian : toujours dire quel seuil on utilise."},{"id":"mn05","s":"IC4","type":"meca","t":"Niveau de vie et unités de consommation","q":"Comment passe-t-on du revenu d'un ménage à son niveau de vie ? L'échelle des unités de consommation.","r":"**Niveau de vie = revenu disponible / nombre d'unités de consommation (UC)**. **1 UC** pour le premier adulte, **0,5** par autre personne de **14 ans ou plus**, **0,3** par enfant de **moins de 14 ans**. Ex : un couple avec un enfant de 10 ans = 1 + 0,5 + 0,3 = **1,8 UC**. À revenu égal, plus le ménage est grand, plus son niveau de vie est faible."},{"id":"mn06","s":"IC4","type":"meca","t":"Compter les UC","q":"Combien d'unités de consommation pour chaque ménage ? Coche la bonne colonne.","r":"Le critère : **1** pour le premier adulte, **0,5** pour toute autre personne de **14 ans ou plus**, **0,3** pour un enfant de **moins de 14 ans**. Le piège : un **ado de 15 ans** compte **0,5** comme un adulte, pas 0,3 ; et la **mère seule avec un fils de 16 ans** pèse autant qu'un couple (1,5).","grille":{"colonnes":["1","1,5","1,8","2","2,1"],"lignes":[["Une personne seule",0],["Un couple sans enfant",1],["Un couple avec un enfant de 10 ans",2],["Un couple avec un ado de 15 ans",3],["Un couple avec deux enfants de 8 et 12 ans",4],["Une mère seule avec un fils de 16 ans",1]]}},{"id":"mn07","s":"IC4","type":"chiffre","t":"Doc 7 : le couple avec un enfant","q":"Doc 7 : le revenu médian d'un couple avec un enfant en 2016, et ce qu'il signifie.","r":"**3 593 € par mois** (Observatoire des inégalités, d'après l'INSEE, 2016) : **la moitié** des couples avec un enfant dispose de **moins** de 3 593 €, l'autre moitié de **plus**. Pour eux : seuil de pauvreté **1 796 €**, seuil de richesse **7 185 €**."},{"id":"mn08","s":"IC4","type":"meca","t":"Les économies d'échelle","q":"Pourquoi un ménage de 4 personnes n'a-t-il pas besoin de 4 fois le revenu d'une personne seule ? Le calcul du Doc 7.","r":"Les **économies d'échelle** : on **partage** le logement, la voiture, l'équipement. Doc 7 : une personne seule est pauvre sous **781 €**, un couple avec deux enfants sous **1 999 €** — seulement **2,6 fois plus** (1 999 / 781 ≈ 2,6) pour **4 fois plus** de personnes. C'est ce que traduit l'échelle des **UC** (0,5 et 0,3 au lieu de 1)."},{"id":"mn09","s":"IC4","type":"meca","t":"Les familles monoparentales","q":"Pourquoi les familles monoparentales sont-elles particulièrement désavantagées ? Avec les chiffres.","r":"**Un seul adulte** apporte un revenu pour plusieurs personnes. Doc 7 : revenu médian **2 063 €**, environ **43 % de moins** qu'un couple avec un enfant (**3 593 €**). Et **84 %** des familles monoparentales ont une **femme** à leur tête (Doc 3) : elles **cumulent** deux facteurs de désavantage, le **sexe** et la **composition du ménage**."},{"id":"syn-IC4","s":"IC4","type":"synthese","t":"Synthèse — la composition des ménages","q":"À l'oral, tout le I.C.4 : montrer que la composition du ménage détermine son niveau de vie. Avec les définitions, le calcul et les chiffres du Doc 7.","r":"① **Ménage** (INSEE) : les occupants d'un même logement, parenté ou non ② **Revenu disponible** (primaires + prestations − prélèvements) et **revenu médian** (50 / 50, ≠ moyenne) ; **seuils** : moitié et double de la médiane (**Observatoire des inégalités** — l'INSEE prend **60 %**) ③ **Niveau de vie = revenu disponible / UC** (1 · 0,5 · 0,3) : plus de membres → niveau de vie plus faible à revenu égal ④ Mais des **économies d'échelle** : seuil de pauvreté **781 €** seul, **1 999 €** pour un couple avec deux enfants (**× 2,6** pour 4 fois plus de personnes) ⑤ Le **nombre d'apporteurs de revenu** : famille **monoparentale** **2 063 €** contre **3 593 €** (**− 43 %**), et **84 %** sont des femmes → **cumul** des désavantages ⑥ ⇒ la composition du ménage est un **facteur de structuration** de l'espace social."},{"id":"cu01","s":"IC5","type":"meca","t":"Les inégalités face au chômage","q":"Inégalités face au chômage : que montrent le sexe, l'âge et le lieu de résidence ? Un exemple pour chacun.","r":"**Sexe** : les femmes en famille **monoparentale** sont environ **2 fois plus** au chômage que les femmes en couple avec enfants (Doc 8 : 15 % contre 7 %) ; elles sont surtout CSP⊖, moins qualifiées. **Âge** : les **jeunes** sont plus touchés (19,2 % chez les 15-24 ans), faute d'expérience et de qualification ; les jeunes peu qualifiés jusqu'à **50 %**. **Lieu** : chômage plus élevé dans le **Nord** (désindustrialisation, cf. **Zola**, *Germinal*) et dans le **Sud**."},{"id":"cu02","s":"IC5","type":"meca","t":"Les inégalités d'accès à la culture","q":"Accès aux loisirs et à la culture : quels effets de l'âge et du lieu de résidence ? (Docs 10-11)","r":"**Âge** : ce sont les **jeunes retraités** qui vont le plus au musée (**46 %** des 60-69 ans), car ils ont **du temps et de l'argent** ; seulement 25 % après 70 ans. **Lieu** : **45 %** dans l'agglomération parisienne contre **28-29 %** dans les petites villes : les ressources culturelles et les CSP⊕ se concentrent en ville. Vacances : **52 %** des enfants de familles monoparentales ne partent pas, contre **7 %** des enfants de diplômés du supérieur."},{"id":"cu03","s":"IC5","type":"auteur","t":"Maurin, la ségrégation spatiale","q":"Éric Maurin : quel livre, et quel phénomène montre-t-il ?","r":"Éric **Maurin**, *Le ghetto français* (2004) : un phénomène de **ségrégation spatiale** — chaque groupe social évite le groupe juste en dessous de lui, et les quartiers se spécialisent socialement. À relier à **Oberti** (I.C.3) et à l'**entre-soi**."},{"id":"cu04","s":"IC5","type":"auteur","t":"Bourdieu, L'amour de l'art","q":"Bourdieu, *L'amour de l'art* : que montre-t-il sur les musées, et pourquoi ?","r":"Pierre **Bourdieu** (avec Darbel), *L'amour de l'art* (**1966**) : même quand l'accès est **plus simple** (gratuité, proximité), **les classes populaires ne vont toujours pas au musée**. Ce n'est pas une question d'argent mais de **capital culturel** : il explique le **rapport à l'art**. Et l'**habitus** : l'ensemble des dispositions propres à une classe."},{"id":"cu05","s":"IC5","type":"def","t":"Les 3 formes du capital culturel","q":"Les trois formes du capital culturel selon Bourdieu, avec un exemple chacune.","r":"① **Objectivé** : les biens matériels — livres, objets d'art, instruments ② **Institutionnalisé** : les **diplômes** ③ **Incorporé** : ce qui est **transmis par la socialisation** et fait partie de la personne — manière de parler, de s'habiller, goûts. (**Bourdieu**)"},{"id":"syn-IC5","s":"IC5","type":"synthese","t":"Synthèse — chômage, loisirs, culture","q":"À l'oral : montrer que le sexe, l'âge et le lieu de résidence structurent l'accès à l'emploi et à la culture. Avec Maurin et Bourdieu.","r":"① **Chômage** : familles monoparentales (femmes, CSP⊖) **2 fois plus** au chômage ; **jeunes** plus touchés (manque d'expérience, de qualification : **50 %** chez les jeunes peu qualifiés) ; **Nord** désindustrialisé (*Germinal*) et **Sud** ② **Culture** : **jeunes retraités** au musée (temps + argent) ; **Paris 45 %** contre ≈ 28 % en petite ville ③ **Ségrégation spatiale** : **Maurin**, *Le ghetto français* ④ Mais l'obstacle n'est pas que matériel : **Bourdieu**, *L'amour de l'art* — le **capital culturel** (objectivé, institutionnalisé, incorporé) et l'**habitus** expliquent le rapport à l'art ⑤ ⇒ les facteurs de structuration **se cumulent**."},{"id":"mu01","s":"II","type":"meca","t":"Les 4 grandes mutations","q":"Les 4 grandes mutations de la structure socioprofessionnelle depuis la seconde moitié du XXe siècle ?","r":"① **Salarisation** ② **Tertiarisation** ③ **Élévation du niveau de qualification** ④ **Féminisation** des emplois. Dans un tableau : pour chacune, une **description statistique** et des **facteurs explicatifs**."},{"id":"syn-II","s":"II","type":"synthese","t":"Synthèse — les 4 mutations","q":"À l'oral, tout le II : les 4 mutations de la structure socioprofessionnelle, chacune avec un chiffre et un facteur.","r":"① **Salarisation** : **56 %** de salariés au début du XXe, **90 %** en 2010 — grandes surfaces, mécanisation, concurrence des industries délocalisées (ex : **IKEA**) ② **Tertiarisation** : tertiaire **≈ 38 % → 80 %** (1954-2024), primaire **28 → 2 %**, secondaire **35 → 17 %** — progrès technique, délocalisations, vieillissement, hausse des revenus ③ **Qualification** : diplômés du supérieur **× 2,7**, cadres **2 → 6,7 M (+ 235 %)** — massification scolaire, progrès technique biaisé ; mais **polarisation** ④ **Féminisation** : **48 %** des emplois en 2018 — tertiarisation, évolution des normes et du droit (Neuwirth 1967, IVG 1975) ⑤ ⇒ une structure plus **salariée, tertiaire, qualifiée et féminisée**."},{"id":"sl01","s":"II1","type":"chiffre","t":"Salarisation : les chiffres","q":"Qu'est-ce que la salarisation ? Les chiffres du cours.","r":"La hausse de la part des **salariés** dans l'emploi : environ **56 %** d'emplois salariés au début du XXe siècle, **90 %** en 2010. En face, les **indépendants** reculent (**agriculteurs**, **ACCE**). Le salariat = une relation de **subordination** à un employeur, en échange d'un salaire et d'une **protection sociale**."},{"id":"sl02","s":"II1","type":"meca","t":"Pourquoi la salarisation","q":"Les trois facteurs explicatifs de la salarisation, avec les exemples du cours.","r":"① **Concurrence des industries délocalisées** aux prix faibles → l'**artisanat** disparaît (ex : le **marchand de meubles** remplacé par **IKEA**) ② **Progrès technique** : la **mécanisation** du secteur primaire fait disparaître les emplois agricoles (indépendants) ③ Les **grandes surfaces** font disparaître les **petits commerces** de centre-ville."},{"id":"syn-II1","s":"II1","type":"synthese","t":"Synthèse — salarisation","q":"À l'oral : décris et explique la salarisation de l'emploi.","r":"① Définition : la part des **salariés** augmente — subordination contre salaire et **protection sociale** ② Chiffres : **56 %** début XXe → **90 %** en 2010 ; recul des **agriculteurs** et des **ACCE** ③ Facteurs : **mécanisation** agricole, **grandes surfaces** contre petits commerces, concurrence à bas prix contre l'**artisanat** (IKEA)."},{"id":"te01","s":"II2","type":"chiffre","t":"Tertiarisation : les chiffres","q":"La répartition de l'emploi par secteur en 1954 et en 2024.","r":"**Primaire** : **28 % → 2 %** · **Secondaire** : **35 % → 17 %** · **Tertiaire** : **≈ 38 % → 80 %**. Moins d'**ouvriers**, plus de **cadres** et d'employés de services."},{"id":"te02","s":"II2","type":"meca","t":"Pourquoi la tertiarisation","q":"Les quatre explications de la tertiarisation, avec les exemples du cours.","r":"① **Progrès technique** : moins d'emplois agricoles ② **Délocalisations** → fermeture d'usines → moins d'**ouvriers** ③ **Vieillissement** → hausse des dépenses de **santé** et des services à la personne (**EHPAD**, ex : **podologue**) ④ Le progrès technique augmente les **salaires** → plus de **consommation** et de temps libre (congés) → **services de loisirs** (cinéma, restaurant)."},{"id":"syn-II2","s":"II2","type":"synthese","t":"Synthèse — tertiarisation","q":"À l'oral : décris et explique la tertiarisation de l'emploi.","r":"① **1954 → 2024** : primaire **28 → 2 %**, secondaire **35 → 17 %**, tertiaire **≈ 38 → 80 %** ② **Offre** : progrès technique (agriculture), **délocalisations** (industrie) ③ **Demande** : **vieillissement** (santé, EHPAD) et **hausse des revenus** (loisirs, restaurants) ④ ⇒ moins d'ouvriers, plus de cadres et d'employés de services."},{"id":"ql01","s":"II3","type":"chiffre","t":"Qualification : les chiffres","q":"L'élévation du niveau de qualification : les chiffres des docs 1, 2 et 3.","r":"**Diplômés du supérieur** × **2,7** entre 1985 et 2022 (indice ≈ 270), jusqu'à × 6 pour certaines filières (doc 1) · **Cadres** : **2 → 6,7 millions** entre 1984 et 2024 (doc 2) · **Ouvriers peu qualifiés** : **2,9 → 0,6 million** · Le diplôme protège : **79,1 %** des bac + 3 en emploi stable contre **52,6 %** des sans-diplôme (doc 3)."},{"id":"ql02","s":"II3","type":"piege","t":"+ 235 %, pas + 34 %","q":"Les cadres passent de 2 à 6,7 millions. Quel taux de variation ? Et les ouvriers peu qualifiés, de 2,9 à 0,6 million ?","r":"Taux de variation = (VA − VD) / VD × 100. Cadres : (6,7 − 2) / 2 × 100 = **+ 235 %** — pas 6,7 / 2 × 100 (ça donne 335, un indice, pas une hausse). Ouvriers peu qualifiés : (0,6 − 2,9) / 2,9 × 100 ≈ **− 79 %**, soit **− 80 %**, pas − 8 %. Les deux erreurs sont dans le brouillon du cahier."},{"id":"ql03","s":"II3","type":"meca","t":"Pourquoi la qualification s'élève","q":"Les facteurs explicatifs de l'élévation du niveau de qualification.","r":"① **Massification scolaire**, volonté politique : objectif **80 % d'une génération au bac** (1985), **bacs pros**, réforme **LMD** ② **Progrès technique** et automatisation : les tâches routinières disparaissent, les entreprises demandent des qualifiés ③ Le **diplôme protège du chômage** : les familles poussent aux études longues ④ **Désindustrialisation**, délocalisations : les emplois peu qualifiés de l'industrie disparaissent."},{"id":"ql04","s":"II3","type":"piege","t":"Toujours plus qualifié ? La polarisation","q":"Quelle évolution va à l'encontre de l'idée d'une élévation générale de la qualification ?","r":"Les **employés peu qualifiés augmentent** : **2,3 → 3,2 millions** (doc 2). L'emploi peu qualifié ne disparaît pas, il passe de l'usine aux **services** (ménage, aide à la personne, restauration) : c'est la **polarisation** de l'emploi (chapitre 1, II.A). Ne jamais écrire que « tous les emplois deviennent qualifiés »."},{"id":"syn-II3","s":"II3","type":"synthese","t":"Synthèse — qualification","q":"À l'oral : décris et explique l'élévation du niveau de qualification, sans oublier sa limite.","r":"① **Individus** : diplômés du supérieur **× 2,7** (1985-2022) ② **Emplois** : cadres **2 → 6,7 M (+ 235 %)**, ouvriers peu qualifiés **2,9 → 0,6 M (− 80 %)** ③ Le diplôme protège : **79,1 %** contre **52,6 %** d'emplois stables ④ Facteurs : **massification** (80 % au bac, bacs pros, LMD), **progrès technique**, désindustrialisation ⑤ **Limite** : employés peu qualifiés **2,3 → 3,2 M** → **polarisation**."},{"id":"fe01","s":"II4","type":"chiffre","t":"Féminisation : les chiffres","q":"La féminisation de l'emploi : le chiffre du cours, et où les femmes entrent dans l'emploi.","r":"Hausse du **taux d'activité** des femmes : en **2018**, **48 %** des emplois sont occupés par des femmes. Elles accèdent à l'emploi surtout par les **services**, en particulier dans les **professions intermédiaires** et chez les **cadres**."},{"id":"fe02","s":"II4","type":"meca","t":"Pourquoi : les facteurs économiques","q":"Le facteur économique de la féminisation de l'emploi, avec les exemples du cours.","r":"La **tertiarisation** crée de **nouveaux emplois** de services, occupés majoritairement par des femmes : le **soin** (infirmière, aide-soignante), l'**éducation** (institutrice), la **fonction publique** — principal support de la féminisation."},{"id":"fe03","s":"II4","type":"meca","t":"Pourquoi : les facteurs sociaux et juridiques","q":"Les facteurs sociaux et juridiques de la féminisation de l'emploi, avec les dates.","r":"**Évolution des normes** : travailler devient **valorisant** pour une femme (c'était mal vu avant). **Droit** : compte bancaire et droit de travailler sans l'autorisation du mari (1965) ; **divorce par consentement mutuel (1975)** → besoin d'**indépendance économique**. **Maîtrise du corps** : **loi Neuwirth (1967)**, contraception, et **IVG (1975)** → les femmes contrôlent leur accès à l'emploi."},{"id":"syn-II4","s":"II4","type":"synthese","t":"Synthèse — féminisation","q":"À l'oral : décris et explique la féminisation de l'emploi.","r":"① **48 %** des emplois occupés par des femmes en **2018**, hausse du taux d'activité ② **Économique** : la **tertiarisation** crée des emplois de services (soin, éducation, fonction publique) ③ **Social** : les **normes** changent, travailler devient valorisant ④ **Juridique** : compte bancaire et droit de travailler, **divorce 1975** (indépendance économique), **Neuwirth 1967** et **IVG 1975** (maîtrise du corps) ⑤ Lien avec le I.C.1 : plus d'emploi féminin, mais toujours un **plafond de verre**."},{"id":"tr01","s":"P2I","type":"meca","t":"Pourquoi la sociologie naît au XIXe","q":"Pourquoi la sociologie apparaît-elle au XIXe siècle ? Les trois révolutions.","r":"Elle naît de **problèmes sociaux** : le XIXe est une période de bouleversements. ① **Politique** : **1789**, puis une grande **instabilité** (une quinzaine de régimes jusqu'en 1870) ② **Économique / industrielle** : on passe de l'agriculture et de l'artisanat à l'**usine** ③ **Spirituelle** : la **science** remplace Dieu comme principe d'explication du monde, mais elle ne rassure pas. ⇒ La sociologie arrive pour **décrypter** cette société nouvelle."},{"id":"tr02","s":"P2I","type":"chiffre","t":"La fin des corporations","q":"Qu'étaient les corporations, et quelles lois les suppriment ?","r":"Une **corporation** réglementait l'exercice d'une **profession** et **protégeait** ceux qui la pratiquaient (ex : à **Amiens**, une corporation d'artisans). Supprimées en **1791** par le **décret d'Allarde** (liberté d'entreprendre) et la **loi Le Chapelier** (interdiction des corporations et des coalitions). ⚠ Le cahier écrit « 1789 » : c'est **1791**. Fin de la protection liée au travail → **libéralisation**, très inquiétant pour les travailleurs."},{"id":"tr03","s":"P2I","type":"meca","t":"L'ouvrier du XIXe siècle","q":"Comment est le travail ouvrier au XIXe siècle ? Avec deux références littéraires (utiles en accroche).","r":"**Exploitation**, **domination**, mal payé, **dangereux** physiquement, à l'**usine**. **Exode rural** : on s'entasse en ville (15 par logement, froid, saleté, suie). Références : Victor **Hugo**, *Melancholia* (le travail des **enfants**) ; Émile **Zola**, *Germinal* (la mine). Le prof les signale comme **accroche de dissertation**."},{"id":"tr04","s":"P2I","type":"auteur","t":"Durkheim : solidarité mécanique et organique","q":"Durkheim, *De la division du travail social* (1893) : comment passe-t-on de la société traditionnelle à la société moderne ?","r":"**Émile Durkheim, 1893** : de la **solidarité mécanique**, fondée sur la **similarité** (société traditionnelle : tous font et pensent la même chose), à la **solidarité organique**, fondée sur la **complémentarité** (société moderne : la **division du travail** rend chacun dépendant des autres). Avec elle émerge l'**individualisme** : on peut avoir un **destin social différent de son origine sociale**."},{"id":"syn-P2I","s":"P2I","type":"synthese","t":"Synthèse — le contexte du XIXe","q":"À l'oral : pourquoi le XIXe siècle fait-il naître les analyses de la structure sociale ? Avec les dates, les lois et Durkheim.","r":"① **Trois révolutions** : politique (**1789**, instabilité jusqu'en 1870), **industrielle** (de l'atelier à l'usine), **spirituelle** (la science remplace Dieu) ② **Fin des corporations** (**1791**, d'Allarde, Le Chapelier) : liberté d'entreprendre, mais fin de la protection ③ **L'ouvrier** : exploité, mal payé, en danger ; exode rural, logements surpeuplés — **Hugo**, *Melancholia*, **Zola**, *Germinal* ④ **Durkheim (1893)** : solidarité **mécanique** (similarité) → **organique** (complémentarité), montée de l'**individualisme** ⑤ ⇒ la sociologie naît pour comprendre cette société : c'est le terrain de **Marx** et de Weber."},{"id":"mx01","s":"P2IA","type":"auteur","t":"Marx : ses œuvres","q":"Karl Marx : les trois œuvres du cours, et ce qu'elles représentent.","r":"*Le Capital* (**1867**) : l'économiste, son œuvre la plus importante · *Le 18 Brumaire de Louis Bonaparte* (**1852**) : le sociologue, la théorie des classes · *Le Manifeste du Parti communiste* (**1848**, avec **Engels**) : l'homme politique. En SES, on parle d'analyse **marxienne** (l'analyse de Marx), pas **marxiste** (la doctrine politique)."},{"id":"mx02","s":"P2IA","type":"def","t":"La classe sociale chez Marx","q":"Selon Marx, qu'est-ce qui définit l'appartenance à une classe sociale ?","r":"Un critère **économique** : la **place occupée dans le processus de production**. Les **capitalistes** (bourgeoisie) **possèdent les moyens de production** (machines, usines) ; les **prolétaires** n'ont que leur **force de travail**, qu'ils doivent **vendre** à un patron. Une vision **binaire**, **hiérarchisée** et **inégalitaire** : l'exploitation d'une classe par l'autre."},{"id":"mx03","s":"P2IA","type":"def","t":"Exploitation et plus-value","q":"Qu'est-ce que la plus-value chez Marx ? En quoi y a-t-il exploitation ?","r":"Le salarié est **payé moins que la richesse qu'il crée** : la différence, c'est la **plus-value**, le **profit** que s'approprie le capitaliste. C'est l'**exploitation économique** : le capital s'accroît du côté de la bourgeoisie, la classe ouvrière ne s'enrichit pas (Doc 4, **J.-P. Durand**, 2018)."},{"id":"mx04","s":"P2IA","type":"piege","t":"Classe en soi / classe pour soi","q":"Distingue classe en soi et classe pour soi chez Marx.","r":"**Classe en soi** : des individus qui occupent la **même place dans la production** et partagent le **même mode de vie** — elle existe **objectivement**. **Classe pour soi** : la classe a pris **conscience** de ses **intérêts communs** et **s'organise pour lutter** contre une autre classe. Le passage de l'une à l'autre se fait **par la lutte**."},{"id":"mx05","s":"P2IA","type":"auteur","t":"Les paysans parcellaires","q":"*Le 18 Brumaire* (1852) : pourquoi les paysans parcellaires forment-ils une classe en soi, mais pas pour soi ?","r":"**En soi** : mêmes conditions économiques, même genre de vie, mêmes intérêts. **Pas pour soi** : chacun cultive sa parcelle, **isolé**, sans échange avec les autres — comme des « **pommes de terre dans un sac** ». Aucune communauté, **aucune organisation politique** : ils sont incapables de défendre leurs intérêts en leur propre nom (**Marx**, Doc 3). Marx **prédit la fin des paysans** : c'est arrivé (primaire **2 %** des emplois en 2024, page ⑫)."},{"id":"mx06","s":"P2IA","type":"def","t":"La lutte des classes","q":"Qu'est-ce que la lutte des classes ? La citation du *Manifeste*.","r":"Le **conflit** entre des classes aux **intérêts opposés** du fait de leur place dans la production : **bourgeoisie** contre **prolétariat**. C'est le **moteur de l'histoire** : « L'histoire de toute société jusqu'à nos jours n'a été que l'histoire de **luttes de classes** » (**Marx et Engels**, *Manifeste du Parti communiste*, **1848**). Une vision **relationnelle et conflictuelle** des classes."},{"id":"mx07","s":"P2IA","type":"meca","t":"Comment naît la classe pour soi","q":"Comment la recherche du profit crée-t-elle la classe ouvrière comme classe pour soi ?","r":"① Pour le **profit**, les capitalistes **exploitent** les ouvriers (bas salaires, tâches simplifiées) ② Ils les **rassemblent** en masse dans les mêmes usines et quartiers, contrairement aux paysans isolés ③ L'exploitation commune fait naître la **conscience de classe** ④ Les ouvriers **s'organisent** (syndicats, grèves, partis) et **luttent** : classe **pour soi**. Image : l'affiche « **One Big Union** » (Chaplin, 1917)."},{"id":"syn-P2IA","s":"P2IA","type":"synthese","t":"Synthèse — les classes chez Marx","q":"À l'oral, tout le I.A : la théorie des classes sociales de Marx. Avec les œuvres, les définitions et un exemple.","r":"① **Marx** : *Le Capital* (1867), *Le 18 Brumaire* (1852), *Manifeste* (1848, avec Engels) — analyse **marxienne** ② **Critère économique** : la place dans la **production** — **bourgeoisie** propriétaire des moyens de production / **prolétariat** qui vend sa force de travail ③ **Exploitation** : le salarié est payé moins qu'il ne produit → **plus-value**, profit du capitaliste ④ Approche **réaliste** : les classes existent avant le sociologue ; l'industrialisation **dépossède** l'ouvrier (tâches routinières) ⑤ **Classe en soi / pour soi** : même place et même mode de vie / **conscience** + **lutte** ; contre-exemple : les **paysans parcellaires**, « sac de pommes de terre » ⑥ **Lutte des classes**, moteur de l'histoire : **lutte = conscience**, une classe qui n'est pas pour soi n'est pas une classe ; vision **binaire, hiérarchisée, conflictuelle** ⑦ Le capitalisme rassemble les ouvriers et fait naître leur **conscience de classe**."},{"id":"mx08","s":"P2IA","type":"meca","t":"L'industrialisation dépossède l'ouvrier","q":"Quel est l'effet de l'industrialisation sur le travail ouvrier ?","r":"Elle **transforme le travail ouvrier** en **tâches routinières** (↗ **mécanisation**). L'ouvrier n'est pas un **artisan** : c'est une **dépossession sociale + économique**. Il travaille **sans savoir-faire** et n'est **responsable que d'une petite partie de la production**. Un travail peu **valorisé**. Et le **capitaliste s'enrichit à travers l'exploitation des ouvriers**."},{"id":"mx09","s":"P2IA","type":"def","t":"L'approche réaliste","q":"Pourquoi dit-on que l'approche de Marx est réaliste ?","r":"**Approche réaliste** : les classes sociales **préexistent au sociologue** (elles existaient déjà), il **ne les met qu'en lumière**. Contre-exemple : la **jeunesse n'est pas une classe sociale**, c'est un groupe **artificiel**, construit par le sociologue pour analyser le monde. ⚠ À opposer à Weber, **nominaliste** (I.B)."},{"id":"mx10","s":"P2IA","type":"meca","t":"Lutte = conscience","q":"Pour Marx, quel lien entre la lutte, la conscience et l'existence d'une classe ?","r":"**Lutte des classes** : le **rapport conflictuel** qui oppose les classes sociales entre elles. Une classe n'est une **classe pour soi** que si elle est **en lutte** contre une autre classe : c'est **dans la lutte** qu'elle prend **conscience** d'avoir des **intérêts communs**. La **mobilisation** est une **condition nécessaire** à l'existence de la classe. Pour Marx, **une classe qui n'est pas pour soi n'est pas une classe**, et les classes **ne préexistent pas au rapport conflictuel** qui les unit. Ex : la **bourgeoisie** lutte pour **conserver** ses intérêts (tirer le plus de **plus-value**), la classe ouvrière pour **ne pas se faire exploiter**."},{"id":"mx11","s":"P2IA","type":"piege","t":"Marx en 4 mots","q":"Le résumé du cours sur Marx, en 4 mots-clés.","r":"① **Critère économique** (place dans la production) ② **Réaliste** (les classes existent avant le sociologue) ③ **En soi / pour soi** ④ **Lutte des classes**. Ce sont les 4 points à placer dans une dissertation dès qu'on cite Marx."},{"id":"wb01","s":"P2IB","type":"auteur","t":"Max Weber : qui, quand, quelles œuvres","q":"Max Weber : situe-le et donne ses deux œuvres du cours.","r":"**Fondateur de la sociologie allemande**, **contemporain de Durkheim** (même époque, jamais d'échange). Les **3 fondateurs** meurent presque ensemble : **Durkheim 1917**, **Simmel 1918**, **Weber 1920**. Ses œuvres : *L'Éthique protestante et l'esprit du capitalisme* (1905) et *Économie et société* (1922, posthume), où il expose sa **théorie des classes sociales** : plus **subtile**, plus **proche de la réalité**, mais **plus complexe** que celle de Marx."},{"id":"wb02","s":"P2IB","type":"def","t":"Les 3 ordres de Weber","q":"Les 3 critères (ordres) de Weber, et le groupe qu'il distingue dans chacun.","r":"① **Ordre économique** → les **classes sociales** : individus qui partagent la **même situation économique** (revenu, patrimoine, position dans le processus de production). ② **Ordre social** → les **groupes de statut** : individus qui partagent le **même degré de prestige social**, une **distinction symbolique** (« privilège de considération sociale »). Ex : la **robe du juge**, la **blouse du médecin**. ③ **Ordre politique** → les **partis** : individus classés selon leur **proximité** et leur **accès au pouvoir**."},{"id":"wb03","s":"P2IB","type":"piege","t":"Classe, groupe de statut ou parti ?","q":"Dans quel ordre de Weber range-t-on chaque exemple ? Coche la bonne colonne.","r":"Revenu, patrimoine, place dans la production = **classe** · prestige, considération = **groupe de statut** · accès au pouvoir = **parti**.","grille":{"colonnes":["Économique (classe)","Social (groupe de statut)","Politique (parti)"],"lignes":[["Deux ménages au même revenu et au même patrimoine",0],["Un juge, reconnu à sa robe",1],["Un député proche du pouvoir",2],["Les jeunes filles du bal des débutantes",1],["Un patron propriétaire de son usine",0],["Un médecin en blouse, respecté de tous",1]]}},{"id":"wb04","s":"P2IB","type":"meca","t":"3 dimensions indépendantes","q":"Pourquoi les 3 dimensions de Weber sont-elles indépendantes ? Y a-t-il quand même un lien ?","r":"Un individu peut être **très haut (+++) sur un critère** et **très bas (− − −) sur les deux autres**. Mais il existe souvent une **corrélation positive** : être favorisé économiquement **donne souvent** du **prestige** et du **pouvoir politique**. Et **pas de rapport de domination** entre les groupes, contrairement à Marx."},{"id":"wb05","s":"P2IB","type":"piege","t":"Marx contre Weber","q":"Les deux grandes oppositions entre Marx et Weber.","r":"① **Unidimensionnelle** (Marx : seul critère économique) **contre multidimensionnelle** (Weber : économique, social, politique). ② **Réaliste** (Marx : les classes existent vraiment et prennent conscience d'elles-mêmes) **contre nominaliste** (Weber : le **sociologue crée par son analyse** des groupes qui **n'existent pas réellement** et **n'ont pas conscience d'exister**). En plus : chez Marx **conflit et domination**, chez Weber **pas de rapport de domination**."},{"id":"wb06","s":"P2IB","type":"auteur","t":"Le bal des débutantes","q":"Le bal des débutantes (vidéo) : qu'illustre-t-il ?","r":"Hôtel 5 étoiles, **Stéphane Bern**, barons de l'industrie, Hollywood, jeunes mondaines associées à une maison de **haute couture**, photos partagées par les médias de chaque pays. Les **élites conjuguent puissance sociale et réseau** : c'est du **prestige social** → un **groupe de statut** au sens de Weber. Il montre le **besoin de la bourgeoisie de se différencier et de se regrouper**."},{"id":"syn-P2IB","s":"P2IB","type":"synthese","t":"Synthèse — les classes chez Weber","q":"À l'oral, tout le I.B : la théorie de Weber, et ce qui l'oppose à Marx. Avec un exemple.","r":"① **Weber** (†1920), fondateur de la sociologie allemande, contemporain de Durkheim ; *L'Éthique protestante* et *Économie et société* ② **3 ordres** : **économique** → classes (revenu, patrimoine, place dans la production) ; **social** → **groupes de statut** (prestige, ex : robe du juge) ; **politique** → **partis** (accès au pouvoir) ③ **3 dimensions indépendantes** (+++ sur une, − − − sur les autres) mais souvent **corrélées** ④ Contre Marx : **multidimensionnel / unidimensionnel**, **nominaliste / réaliste**, pas de domination ⑤ Ex : le **bal des débutantes**, la bourgeoisie se **différencie** et se **regroupe** par le prestige."},{"id":"cl01","s":"P2IIA1","type":"def","t":"La classe sociale (définition du II)","q":"Définition de la classe sociale donnée au début du II.","r":"**Ensemble d'individus qui occupent une position similaire dans l'ordre socio-économique et partagent des intérêts communs.** Le II pose la question : cette notion est-elle **encore pertinente** aujourd'hui ? C'est **une notion en débat**."},{"id":"cl02","s":"P2IIA1","type":"piege","t":"Inter-classe ou intra-classe ?","q":"Frontières inter-classe et intra-classe : laquelle est entre les classes, laquelle est à l'intérieur ?","r":"**Inter**-classe = **entre** les classes (ex : la moyennisation de **Mendras** les brouille). **Intra**-classe = **à l'intérieur** d'une classe (ex : qualifiés / non-qualifiés chez les ouvriers et les employés). ⚠ Le cahier (page ㉑) les **inverse** : à corriger. Moyen de s'en souvenir : **inter**national = entre les nations."},{"id":"mo01","s":"P2IIA1","type":"auteur","t":"Mendras et la toupie","q":"Henri Mendras, *La Seconde Révolution française* (1988) : décris la toupie, avec les chiffres.","r":"Analysant la France de **1965 à 1984**, **Mendras (1988)** remplace la **pyramide** par une **toupie** : une **petite élite (3 %)**, des **exclus (pauvreté, 7 %)**, une **constellation populaire (50 %)** et une **constellation centrale (25 %)** en forte expansion, surtout les **cadres**. Elle est marquée par une **mobilité sociale intense** et diffuse ses **innovations** à toute la société (ex : le **barbecue**). Elle **va contre la théorie de Marx** : plus d'**antagonisme** entre deux classes, les **classes moyennes** prennent de plus en plus de place. ⚠ Populaire = 50 %, centrale = 25 % (le cahier les mélange page ㉑)."},{"id":"mo02","s":"P2IIA1","type":"def","t":"Le rapport interdécile","q":"Qu'est-ce que le rapport interdécile D9/D1 ?","r":"**D1** = le revenu (ou niveau de vie) **le plus élevé des 10 % les plus pauvres**. **D9** = **le plus faible des 10 % les plus riches**. **D9/D1** dit **combien de fois** le seuil des plus riches dépasse celui des plus pauvres. Plus il baisse, plus les **inégalités de revenus** se réduisent. ⚠ C'est un **rapport** (« 4,6 fois »), pas des points ni des %."},{"id":"mo03","s":"P2IIA1","type":"chiffre","t":"Les chiffres de la moyennisation","q":"Les chiffres des docs 2 et 3 qui prouvent la moyennisation.","r":"**Rapport interdécile** (Insee, doc 3) : **4,6 en 1970** → **3,3 en 1985-1990** → remonte à **3,6 en 2010**. **Équipement des ménages** (Insee, doc 2) : en **2012**, la **quasi-totalité** a une **télévision**, plus de **80 %** une **voiture**, environ **60 %** un **lave-vaisselle** (20 % en 1980). Plus les nouveaux biens : four à micro-ondes, téléphone portable, micro-ordinateur."},{"id":"mo04","s":"P2IIA1","type":"meca","t":"Les 3 arguments de la moyennisation","q":"Les 3 arguments qui montrent la moyennisation de la société (exo docs 1 à 3).","r":"Ⓐ **Mendras, la toupie** : la **constellation centrale** (25 %, surtout des **cadres**) grossit, **mobilité sociale intense**, **embourgeoisement** de la société. Ⓑ **Homogénéisation des modes de vie** : la **consommation de masse** rend les mêmes biens accessibles à tous, ils ne permettent plus de **distinguer les classes** (lave-vaisselle, télévision). Ⓒ **Baisse des inégalités de revenus** : le **rapport interdécile** recule (4,6 en 1970 → 3,6 en 2010), avec la ↗ du **niveau de qualification**. ⇒ Les **frontières inter-classe se brouillent**."},{"id":"mo05","s":"P2IIA1","type":"meca","t":"Homogénéisation des modes de vie","q":"Comment la consommation de masse brouille-t-elle les frontières entre les classes ?","r":"La **consommation de masse** (des biens et services accessibles à tous) **rapproche les modes de consommation** des différentes classes. On **ne peut plus utiliser les biens de consommation** pour distinguer des pratiques **socialement hiérarchisées** : en **2012**, la **quasi-totalité** des ménages a une **télévision**. L'objet ne distingue plus les classes populaires des classes supérieures : on parle d'**embourgeoisement de la classe ouvrière** (Mendras : l'« embourgeoisement » des ouvriers)."},{"id":"mo06","s":"P2IIA1","type":"piege","t":"Pyramide contre toupie","q":"En quoi la toupie de Mendras s'oppose-t-elle à Marx ?","r":"Marx : une société **binaire** et **conflictuelle**, bourgeoisie contre prolétariat (une **pyramide** hiérarchisée). Mendras : une société qui se **moyennise**, avec un **gros centre** (constellations centrale et populaire = 75 %), des **frontières floues** et une **mobilité intense** : les anciennes théories, **notamment celle de Marx**, ne seraient **plus d'actualité**. C'est la thèse de la **fin des classes sociales** (II.A)."},{"id":"syn-P2IIA1","s":"P2IIA1","type":"synthese","t":"Synthèse — la fin des classes ? Les frontières inter-classe","q":"À l'oral, le II.A.1 : pourquoi peut-on parler d'une moyennisation de la société ? Avec l'auteur, les 3 arguments et les chiffres.","r":"① **Classe sociale** : position similaire dans l'ordre socio-économique + intérêts communs ; une **notion en débat** ② Depuis la **seconde moitié du XXe**, les **frontières inter-classe** (entre les classes) se brouillent ③ **Mendras (1988)**, la **toupie** : élite 3 %, exclus 7 %, constellation **populaire 50 %**, **centrale 25 %** (cadres), **mobilité intense**, contre la pyramide de **Marx** ④ **Homogénéisation des modes de vie** : consommation de masse, télévision chez la quasi-totalité des ménages en 2012, lave-vaisselle ≈ 60 % ⑤ **Baisse des inégalités** : D9/D1 **4,6 (1970) → 3,6 (2010)** ⑥ ⇒ **embourgeoisement** et **moyennisation**. (La suite, **b) les frontières intra-classe**, n'est pas encore au cahier.)"},{"id":"pl01","s":"PL","type":"meca","t":"Le plan de la Partie 1","q":"Récite le plan de la Partie 1 : la question, les titres du I et du II, et leurs sous-parties.","r":"**Partie 1 — Comment caractériser la structure sociale française ?** Intro : quels critères pour le portrait d'un individu (Hervé). **I. Des facteurs multiples de structuration et de hiérarchisation de l'espace social** : A. Les **PCS** · B. Inégalités selon la **PCS et le diplôme** · C. Les autres facteurs : 1. **sexe** 2. **âge** 3. **lieu de résidence** 4. **composition des ménages** 5. **ils se cumulent** (chômage, loisirs, culture). **II. Les évolutions de la structure socioprofessionnelle depuis 1950** : 1. **salarisation** 2. **tertiarisation** 3. **élévation de la qualification** 4. **féminisation**."},{"id":"pl02","s":"PL","type":"meca","t":"Partie 1 · I : un argument et un exemple par sous-partie","q":"Pour chaque sous-partie du I (A, B, C.1 à C.5), donne l'idée et UN exemple chiffré ou un auteur.","r":"**A. PCS** : 6 groupes classés selon le statut, la qualification, la place dans la hiérarchie (pas le salaire) · **B. Diplôme** : diplôme → qualification → salaire ; espérance de vie **CPIS 84 ans / ouvrier 77 ans** · **C.1 Sexe** : **24 %** d'écart de revenu salarial, **9,9 %** à poste égal ; plafond de verre · **C.2 Âge** : patrimoine **×4,8** entre moins de 30 ans et 50-59 ans (**Modigliani**) · **C.3 Résidence** : ségrégation, entre-soi (**Oberti**) · **C.4 Ménages**
